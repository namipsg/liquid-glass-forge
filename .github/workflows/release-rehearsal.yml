name: Immutable distribution rehearsal (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    if: github.repository == 'namipsg/liquid-glass-forge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.19.0 pnpm@10.34.5 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Align ephemeral container home ownership for Firefox
        run: chown "$(id -u):$(id -g)" "$HOME"
      - run: pnpm test
      - run: pnpm release:prepare --output private/phase-12/ci
      - run: pnpm release:consumers --manifest private/phase-12/ci/manifest.json
      - run: pnpm release:verify --manifest private/phase-12/ci/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-${{ github.sha }}
          path: private/phase-12/ci/
          if-no-files-found: error
          retention-days: 14
