name: Contracts, sources and packed consumers
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea # v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 30
    env:
      LGF_FIREFOX_XVFB: '1'
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.6', '24.21.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10.34.5 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure the browser container and verify checkout
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: xvfb-run -a pnpm test:base
        if: matrix.node == '20.19.6'
      - run: xvfb-run -a pnpm test
        if: matrix.node == '24.21.0'
      - run: node --test spikes/phase-1/cpu.test.mjs spikes/phase-1/admission.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contracts-${{ matrix.node }}-${{ github.sha }}
          path: |
            private/phase-6/browser/*/receipt.json
            private/phase-7/consumer/*/receipt.json
            private/phase-8/consumer/*/receipt.json
            private/phase-9/consumer/*/receipt.json
            private/phase-10/opaque/*/receipt.json
            private/phase-10/integration/*/receipt.json
            private/phase-10/integration/*/*-events.json
          if-no-files-found: ignore
          retention-days: 14
