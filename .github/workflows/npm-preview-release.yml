name: Release an approved npm preview
run-name: npm preview ${{ inputs.manifest_sha256 }}

on:
  workflow_dispatch:
    inputs:
      preparation_run:
        description: Successful npm preview preparation run on main
        required: true
        type: string
      manifest_sha256:
        description: Exact SHA-256 of the manifest to review
        required: true
        type: string

permissions: {}

env:
  PREPARATION_RUN: ${{ inputs.preparation_run }}
  APPROVED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}

jobs:
  review:
    if: github.repository == 'namipsg/liquid-glass-forge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify preparation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PREPARATION_RUN" =~ ^[0-9]+$ && "$APPROVED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARATION_RUN" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .head_repository.full_name == $repo and
              .head_branch == "main" and .event == "workflow_dispatch" and
              .path == ".github/workflows/npm-preview.yml" and .conclusion == "success"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARATION_RUN/jobs" |
            jq -e 'any(.jobs[]; .name == "prepare" and .conclusion == "success")'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run }}
          name: npm-preview-${{ github.sha }}
          path: private/npm-preview-release
      - name: Show the immutable manifest for review
        run: node scripts/release-npm-preview.mjs review private/npm-preview-release/manifest.json >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish and tag the reviewed preview
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: npm-preview-release
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    concurrency:
      group: npm-preview-stage
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Verify the owner's environment approval and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e 'any(.[]; .state == "approved" and .user.login == "namipsg" and
              any(.environments[]; .name == "npm-preview-release"))'
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$tip" = "$GITHUB_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run }}
          name: npm-preview-${{ github.sha }}
          path: private/npm-preview-release
      - name: Publish frozen artifacts and verify both dist-tags
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/forge-preview-release.npmrc
        run: node scripts/release-npm-preview.mjs release private/npm-preview-release/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-preview-release-receipt
          path: private/npm-preview-release/release-receipt.json
          if-no-files-found: ignore
